name: ci

# Pipelines live in github.com/Sigeth/opslab-ci (Dagger) and run the targets
# of this repository's Makefile. Run them locally with:
#   dagger -m github.com/Sigeth/opslab-ci@v0.1.0 call go --source=. check --targets=lint,test,verify-generated

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.11"
          module: github.com/Sigeth/opslab-ci@v0.1.0
          verb: call
          args: go --source=. check --targets=lint,test,verify-generated

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.11"
          module: github.com/Sigeth/opslab-ci@v0.1.0
          verb: call
          args: go --source=. licenses

  crds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.11"
          module: github.com/Sigeth/opslab-ci@v0.1.0
          verb: call
          args: crds --crds=crds --samples=samples --rejected=samples/invalid
