---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: catalogsources.opslab.io
spec:
  group: opslab.io
  names:
    kind: CatalogSource
    listKind: CatalogSourceList
    plural: catalogsources
    singular: catalogsource
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.ref
      name: Ref
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last sync
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CatalogSource is a catalog of challenges the platform can install
          from.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CatalogSourceSpec defines where a catalog lives and who is
              trusted.
            properties:
              ref:
                description: Ref is the OCI reference of the catalog index, e.g. "ghcr.io/sigeth/opslab-catalog:latest".
                type: string
              suspend:
                description: Suspend stops syncing the source.
                type: boolean
              syncInterval:
                description: SyncInterval between index refreshes. Defaults to 1h.
                type: string
              trust:
                description: Trust lists the signers whose index and packages are
                  accepted.
                properties:
                  allowUnsigned:
                    description: AllowUnsigned accepts unsigned packages. For local
                      development only.
                    type: boolean
                  keyless:
                    description: Keyless identities (Sigstore certificates), e.g.
                      a CI workflow.
                    items:
                      description: KeylessIdentity matches a Sigstore keyless signing
                        certificate.
                      properties:
                        issuer:
                          description: Issuer is the OIDC issuer, e.g. "https://token.actions.githubusercontent.com".
                          type: string
                        subjectRegExp:
                          description: |-
                            SubjectRegExp matches the certificate subject, e.g.
                            "^https://github.com/Sigeth/opslab-challenge-.*/.github/workflows/release.yaml@.*$".
                          type: string
                      required:
                      - issuer
                      - subjectRegExp
                      type: object
                    type: array
                  keys:
                    description: Keys are PEM-encoded cosign public keys.
                    items:
                      type: string
                    type: array
                type: object
                x-kubernetes-validations:
                - message: trust must list keys or keyless identities, or allow unsigned
                    packages
                  rule: (has(self.allowUnsigned) && self.allowUnsigned) || (has(self.keys)
                    && size(self.keys) > 0) || (has(self.keyless) && size(self.keyless)
                    > 0)
            required:
            - ref
            - trust
            type: object
          status:
            description: CatalogSourceStatus reports the last sync of a catalog.
            properties:
              conditions:
                description: Conditions of the source.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              indexDigest:
                description: IndexDigest is the digest of the last verified index.
                type: string
              lastSyncTime:
                description: LastSyncTime is when the index was last fetched successfully.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation last processed by
                  the operator.
                format: int64
                type: integer
              packages:
                description: Packages listed by the index.
                items:
                  description: CatalogEntry describes one package of a catalog.
                  properties:
                    category:
                      description: Category of the challenge.
                      enum:
                      - linux-hardening
                      - containers
                      - kubernetes
                      type: string
                    difficulty:
                      description: Difficulty of the challenge.
                      enum:
                      - easy
                      - medium
                      - hard
                      - insane
                      type: string
                    name:
                      description: Name of the package.
                      type: string
                    summary:
                      description: Summary of the challenge.
                      type: string
                    tags:
                      description: Tags of the challenge.
                      items:
                        type: string
                      type: array
                    title:
                      description: Title of the challenge.
                      type: string
                    versions:
                      description: Versions available, newest first.
                      items:
                        description: CatalogVersion is one published version of a
                          package.
                        properties:
                          ref:
                            description: |-
                              Ref is the OCI reference of the package, pinned by digest
                              (registry/repository@sha256:...).
                            type: string
                          version:
                            description: Version (semver).
                            type: string
                        required:
                        - ref
                        - version
                        type: object
                      minItems: 1
                      type: array
                  required:
                  - category
                  - difficulty
                  - name
                  - title
                  - versions
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
