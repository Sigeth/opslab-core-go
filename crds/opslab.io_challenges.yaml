---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: challenges.opslab.io
spec:
  group: opslab.io
  names:
    kind: Challenge
    listKind: ChallengeList
    plural: challenges
    shortNames:
    - chal
    singular: challenge
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.package.metadata.version
      name: Version
      type: string
    - jsonPath: .status.runnable
      name: Runnable
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Challenge is a challenge package installed in the cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ChallengeSpec selects the package to install.
            properties:
              disabled:
                description: |-
                  Disabled hides the challenge from students without uninstalling it.
                  Running instances are not affected.
                type: boolean
              source:
                description: Source of the package.
                properties:
                  catalog:
                    description: Catalog installs a package listed by a CatalogSource.
                    properties:
                      name:
                        description: Name of the package.
                        type: string
                      source:
                        description: Source is the name of the CatalogSource.
                        type: string
                      version:
                        description: Version of the package.
                        type: string
                    required:
                    - name
                    - source
                    - version
                    type: object
                  inline:
                    description: |-
                      Inline embeds the package. For local development only: inline packages
                      are not signed.
                    properties:
                      filesConfigMap:
                        description: |-
                          FilesConfigMap is the name of a ConfigMap in the operator namespace
                          holding the package files (instructions, setup scripts...). Keys are
                          paths with '/' replaced by '__'.
                        type: string
                      package:
                        description: Package is the challenge manifest.
                        properties:
                          apiVersion:
                            description: APIVersion must be "opslab.io/v1alpha1".
                            type: string
                          kind:
                            description: Kind must be "ChallengePackage".
                            type: string
                          metadata:
                            description: Metadata identifies the package.
                            properties:
                              name:
                                description: 'Name is the package name: lowercase
                                  letters, digits and ''-'' (DNS-1123 label).'
                                type: string
                              version:
                                description: Version is a semantic version (https://semver.org),
                                  e.g. "1.2.0".
                                type: string
                            required:
                            - name
                            - version
                            type: object
                          spec:
                            description: Spec describes the challenge.
                            properties:
                              access:
                                description: Access defines how the student reaches
                                  the machines.
                                properties:
                                  ide:
                                    description: IDE runs a browser IDE (openvscode-server)
                                      on a machine.
                                    properties:
                                      machine:
                                        description: Machine the IDE runs on. Cannot
                                          be a vcluster machine.
                                        type: string
                                    required:
                                    - machine
                                    type: object
                                  terminals:
                                    description: Terminals offered to the student,
                                      in display order.
                                    items:
                                      description: Terminal is a shell offered to
                                        the student.
                                      properties:
                                        label:
                                          description: Label shown on the terminal
                                            tab. Defaults to the machine name.
                                          type: string
                                        machine:
                                          description: Machine the terminal opens
                                            on. Cannot be a vcluster machine.
                                          type: string
                                        user:
                                          description: User the shell runs as. Defaults
                                            to "student".
                                          type: string
                                      required:
                                      - machine
                                      type: object
                                    maxItems: 16
                                    minItems: 1
                                    type: array
                                  web:
                                    description: Web endpoints inside the instance
                                      proxied to the student's browser.
                                    items:
                                      description: WebEndpoint is an HTTP service
                                        inside the instance shown to the student.
                                      properties:
                                        label:
                                          description: Label shown in the UI.
                                          type: string
                                        machine:
                                          description: Machine serving the endpoint.
                                          type: string
                                        port:
                                          description: Port the service listens on.
                                          format: int32
                                          maximum: 65535
                                          minimum: 1
                                          type: integer
                                      required:
                                      - machine
                                      - port
                                      type: object
                                    maxItems: 16
                                    type: array
                                required:
                                - terminals
                                type: object
                              authors:
                                description: Authors of the challenge.
                                items:
                                  description: Author of a challenge.
                                  properties:
                                    name:
                                      description: Name of the author.
                                      type: string
                                    url:
                                      description: URL of the author (website, GitHub
                                        profile...).
                                      type: string
                                  required:
                                  - name
                                  type: object
                                type: array
                              category:
                                description: Category is the topic of the challenge.
                                enum:
                                - linux-hardening
                                - containers
                                - kubernetes
                                type: string
                              difficulty:
                                description: Difficulty is the expected difficulty.
                                enum:
                                - easy
                                - medium
                                - hard
                                - insane
                                type: string
                              estimatedTime:
                                description: EstimatedTime is how long a student typically
                                  needs, e.g. "30m".
                                type: string
                              extraManifests:
                                description: |-
                                  ExtraManifests are paths (relative to the package root) of Kubernetes
                                  manifests applied in the instance namespace. Only namespaced resources
                                  are allowed. Prefer machines: use this as an escape hatch.
                                items:
                                  type: string
                                type: array
                              license:
                                description: License is the SPDX identifier of the
                                  challenge license, e.g. "MIT".
                                type: string
                              lifetime:
                                description: Lifetime bounds how long an instance
                                  lives.
                                properties:
                                  default:
                                    description: Default lifetime of a new instance.
                                      Defaults to 1h.
                                    type: string
                                  max:
                                    description: Max is the maximum lifetime, extensions
                                      included. Defaults to 3h.
                                    type: string
                                type: object
                              machines:
                                description: Machines that make up one instance of
                                  the challenge.
                                items:
                                  description: |-
                                    Machine is one unit of an instance (a pod, system container, virtual
                                    cluster or virtual machine).
                                  properties:
                                    image:
                                      description: |-
                                        Image is a container image (pod, sysbox) or a KubeVirt containerDisk
                                        image (vm). Pin it by digest. Not used by vcluster.
                                      type: string
                                    kubeconfigFor:
                                      description: |-
                                        KubeconfigFor injects into this machine a kubeconfig for the named
                                        vcluster machine.
                                      type: string
                                    kubernetes:
                                      description: Kubernetes is the version of the
                                        virtual cluster, e.g. "1.34" (vcluster only).
                                      type: string
                                    name:
                                      description: Name of the machine, unique in
                                        the package (DNS-1123 label).
                                      type: string
                                    resources:
                                      description: Resources requested by the machine.
                                      properties:
                                        cpu:
                                          anyOf:
                                          - type: integer
                                          - type: string
                                          description: CPU, e.g. "500m" or "1".
                                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                          x-kubernetes-int-or-string: true
                                        memory:
                                          anyOf:
                                          - type: integer
                                          - type: string
                                          description: Memory, e.g. "512Mi" or "1Gi".
                                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                          x-kubernetes-int-or-string: true
                                      required:
                                      - cpu
                                      - memory
                                      type: object
                                    runtime:
                                      description: Runtime is the isolation technology
                                        the machine runs on.
                                      enum:
                                      - pod
                                      - sysbox
                                      - vcluster
                                      - vm
                                      type: string
                                    seed:
                                      description: |-
                                        Seed lists manifest files or directories (paths relative to the package
                                        root) applied into the virtual cluster at provisioning (vcluster only).
                                      items:
                                        type: string
                                      type: array
                                    setup:
                                      description: |-
                                        Setup lists scripts (paths relative to the package root) run once as
                                        root at provisioning, in order. Not supported by vcluster: use seed.
                                      items:
                                        type: string
                                      type: array
                                  required:
                                  - name
                                  - runtime
                                  type: object
                                maxItems: 16
                                minItems: 1
                                type: array
                              permissions:
                                description: |-
                                  Permissions declares what the challenge needs from the cluster. They are
                                  shown to the admin at install time and checked against cluster policy.
                                properties:
                                  egress:
                                    description: Egress is the outbound network access
                                      the instance needs. Defaults to "none".
                                    enum:
                                    - none
                                    - internet
                                    - allowlist
                                    type: string
                                  egressAllowlist:
                                    description: EgressAllowlist lists the host names
                                      reachable when egress is "allowlist".
                                    items:
                                      type: string
                                    type: array
                                type: object
                              requires:
                                description: Requires lists compatibility requirements.
                                properties:
                                  platform:
                                    description: Platform is a semantic version constraint
                                      on the platform version, e.g. ">=0.3.0".
                                    type: string
                                type: object
                              summary:
                                description: Summary is a one or two sentence pitch
                                  shown in the catalog.
                                type: string
                              tags:
                                description: Tags are free-form keywords used for
                                  search.
                                items:
                                  type: string
                                type: array
                              tasks:
                                description: Tasks are the gradable objectives of
                                  the challenge.
                                items:
                                  description: Task is a gradable objective.
                                  properties:
                                    check:
                                      description: |-
                                        Check evaluated by the built-in checker. Required unless the package
                                        uses a custom checker image.
                                      properties:
                                        file:
                                          description: File asserts properties of
                                            a file on the machine.
                                          properties:
                                            contains:
                                              description: Contains is a regular expression
                                                the content must match.
                                              type: string
                                            exists:
                                              description: Exists is whether the file
                                                must exist. Defaults to true.
                                              type: boolean
                                            mode:
                                              description: Mode is the expected octal
                                                permission mode, e.g. "0600".
                                              type: string
                                            notContains:
                                              description: NotContains is a regular
                                                expression the content must not match.
                                              type: string
                                            owner:
                                              description: Owner is the expected owner,
                                                "user" or "user:group".
                                              type: string
                                            path:
                                              description: Path of the file (absolute).
                                              type: string
                                          required:
                                          - path
                                          type: object
                                        goss:
                                          description: Goss runs a goss spec on the
                                            machine.
                                          properties:
                                            spec:
                                              description: Spec is the path of the
                                                goss YAML file, relative to the package
                                                root.
                                              type: string
                                          required:
                                          - spec
                                          type: object
                                        http:
                                          description: HTTP sends a request from the
                                            checker.
                                          properties:
                                            expectBody:
                                              description: ExpectBody is a regular
                                                expression the body must match.
                                              type: string
                                            expectStatus:
                                              description: ExpectStatus is the expected
                                                status code. Defaults to 200.
                                              format: int32
                                              type: integer
                                            path:
                                              description: Path of the request. Defaults
                                                to "/".
                                              type: string
                                            port:
                                              description: Port of the service.
                                              format: int32
                                              maximum: 65535
                                              minimum: 1
                                              type: integer
                                            scheme:
                                              description: Scheme is "http" or "https".
                                                Defaults to "http".
                                              enum:
                                              - http
                                              - https
                                              type: string
                                          required:
                                          - port
                                          type: object
                                        kubeCEL:
                                          description: KubeCEL evaluates a CEL expression
                                            over objects of a vcluster machine.
                                          properties:
                                            all:
                                              description: All passes when the expression
                                                is true for every selected object
                                                (and at least one is selected).
                                              type: string
                                            any:
                                              description: Any passes when the expression
                                                is true for at least one selected
                                                object.
                                              type: string
                                            none:
                                              description: None passes when the expression
                                                is false for every selected object.
                                              type: string
                                            resource:
                                              description: Resource selects the objects
                                                to evaluate.
                                              properties:
                                                apiVersion:
                                                  description: APIVersion of the objects,
                                                    e.g. "v1" or "apps/v1".
                                                  type: string
                                                kind:
                                                  description: Kind of the objects,
                                                    e.g. "Pod".
                                                  type: string
                                                labelSelector:
                                                  description: LabelSelector in kubectl
                                                    syntax, e.g. "app=web,tier!=db".
                                                  type: string
                                                name:
                                                  description: Name of a single object.
                                                  type: string
                                                namespace:
                                                  description: Namespace of the objects.
                                                    Empty selects all namespaces (or
                                                    cluster-scoped objects).
                                                  type: string
                                              required:
                                              - apiVersion
                                              - kind
                                              type: object
                                          required:
                                          - resource
                                          type: object
                                          x-kubernetes-validations:
                                          - message: exactly one of all, any and none
                                              must be set
                                            rule: '(has(self.all) ? 1 : 0) + (has(self.any)
                                              ? 1 : 0) + (has(self.none) ? 1 : 0)
                                              == 1'
                                        machine:
                                          description: Machine the check targets.
                                          type: string
                                        port:
                                          description: Port probes a port from the
                                            checker.
                                          properties:
                                            expect:
                                              description: Expect is the expected
                                                state of the port.
                                              enum:
                                              - open
                                              - closed
                                              type: string
                                            port:
                                              description: Port to probe.
                                              format: int32
                                              maximum: 65535
                                              minimum: 1
                                              type: integer
                                            protocol:
                                              description: Protocol of the probe.
                                                Defaults to "tcp".
                                              enum:
                                              - tcp
                                              - udp
                                              type: string
                                          required:
                                          - expect
                                          - port
                                          type: object
                                        shell:
                                          description: Shell runs a command on the
                                            machine.
                                          properties:
                                            expectExit:
                                              description: ExpectExit is the expected
                                                exit code. Defaults to 0.
                                              format: int32
                                              type: integer
                                            expectOutput:
                                              description: ExpectOutput is a regular
                                                expression stdout must match.
                                              type: string
                                            run:
                                              description: Run is the command, executed
                                                with /bin/sh -c.
                                              type: string
                                            user:
                                              description: User running the command.
                                                Defaults to "root".
                                              type: string
                                          required:
                                          - run
                                          type: object
                                        sshLogin:
                                          description: SSHLogin attempts an SSH login
                                            from the checker (vm and sysbox machines).
                                          properties:
                                            expect:
                                              description: Expect is whether the login
                                                must be allowed or denied.
                                              enum:
                                              - allowed
                                              - denied
                                              type: string
                                            method:
                                              description: Method of authentication.
                                                Defaults to "key".
                                              enum:
                                              - key
                                              - password
                                              type: string
                                            password:
                                              description: Password used with the
                                                "password" method.
                                              type: string
                                            user:
                                              description: User to log in as.
                                              type: string
                                          required:
                                          - expect
                                          - user
                                          type: object
                                      required:
                                      - machine
                                      type: object
                                      x-kubernetes-validations:
                                      - message: exactly one check type must be set
                                        rule: '(has(self.shell) ? 1 : 0) + (has(self.file)
                                          ? 1 : 0) + (has(self.sshLogin) ? 1 : 0)
                                          + (has(self.port) ? 1 : 0) + (has(self.http)
                                          ? 1 : 0) + (has(self.kubeCEL) ? 1 : 0) +
                                          (has(self.goss) ? 1 : 0) == 1'
                                    hints:
                                      description: Hints the student can reveal, in
                                        order.
                                      items:
                                        description: Hint is a clue a student can
                                          reveal.
                                        properties:
                                          cost:
                                            description: Cost in points deducted when
                                              the hint is revealed.
                                            format: int32
                                            minimum: 0
                                            type: integer
                                          text:
                                            description: Text of the hint (markdown).
                                            type: string
                                        required:
                                        - text
                                        type: object
                                      maxItems: 8
                                      type: array
                                    id:
                                      description: ID of the task, unique in the package
                                        (DNS-1123 label).
                                      type: string
                                    points:
                                      description: Points awarded when the task is
                                        solved.
                                      format: int32
                                      minimum: 0
                                      type: integer
                                    title:
                                      description: Title shown to the student.
                                      type: string
                                  required:
                                  - id
                                  - points
                                  - title
                                  type: object
                                maxItems: 64
                                minItems: 1
                                type: array
                              title:
                                description: Title is the human-readable name of the
                                  challenge.
                                type: string
                              validation:
                                description: Validation configures how tasks are checked.
                                properties:
                                  checkerImage:
                                    description: |-
                                      CheckerImage is a custom checker image. When empty, the built-in checker
                                      evaluates each task's check.
                                    type: string
                                  interval:
                                    description: Interval between automatic checks
                                      (auto mode only). Defaults to 30s, minimum 10s.
                                    type: string
                                  mode:
                                    description: Mode controls when tasks are checked.
                                      Defaults to "on-demand".
                                    enum:
                                    - on-demand
                                    - auto
                                    type: string
                                type: object
                            required:
                            - access
                            - category
                            - difficulty
                            - machines
                            - summary
                            - tasks
                            - title
                            type: object
                        required:
                        - apiVersion
                        - kind
                        - metadata
                        - spec
                        type: object
                    required:
                    - package
                    type: object
                  oci:
                    description: OCI installs a package from an OCI reference.
                    properties:
                      ref:
                        description: Ref is the OCI reference, preferably pinned by
                          digest.
                        type: string
                      trust:
                        description: Trust lists the signers whose package is accepted.
                        properties:
                          allowUnsigned:
                            description: AllowUnsigned accepts unsigned packages.
                              For local development only.
                            type: boolean
                          keyless:
                            description: Keyless identities (Sigstore certificates),
                              e.g. a CI workflow.
                            items:
                              description: KeylessIdentity matches a Sigstore keyless
                                signing certificate.
                              properties:
                                issuer:
                                  description: Issuer is the OIDC issuer, e.g. "https://token.actions.githubusercontent.com".
                                  type: string
                                subjectRegExp:
                                  description: |-
                                    SubjectRegExp matches the certificate subject, e.g.
                                    "^https://github.com/Sigeth/opslab-challenge-.*/.github/workflows/release.yaml@.*$".
                                  type: string
                              required:
                              - issuer
                              - subjectRegExp
                              type: object
                            type: array
                          keys:
                            description: Keys are PEM-encoded cosign public keys.
                            items:
                              type: string
                            type: array
                        type: object
                        x-kubernetes-validations:
                        - message: trust must list keys or keyless identities, or
                            allow unsigned packages
                          rule: (has(self.allowUnsigned) && self.allowUnsigned) ||
                            (has(self.keys) && size(self.keys) > 0) || (has(self.keyless)
                            && size(self.keyless) > 0)
                    required:
                    - ref
                    - trust
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of catalog, oci and inline must be set
                  rule: '(has(self.catalog) ? 1 : 0) + (has(self.oci) ? 1 : 0) + (has(self.inline)
                    ? 1 : 0) == 1'
            required:
            - source
            type: object
          status:
            description: ChallengeStatus reports the installation of a challenge.
            properties:
              conditions:
                description: Conditions of the challenge.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              digest:
                description: Digest of the installed package artifact. New instances
                  use it.
                type: string
              mirrored:
                description: Mirrored is true when the package and its images are
                  in the in-cluster registry.
                type: boolean
              observedGeneration:
                description: ObservedGeneration is the generation last processed by
                  the operator.
                format: int64
                type: integer
              package:
                description: Package is the resolved and validated manifest.
                properties:
                  apiVersion:
                    description: APIVersion must be "opslab.io/v1alpha1".
                    type: string
                  kind:
                    description: Kind must be "ChallengePackage".
                    type: string
                  metadata:
                    description: Metadata identifies the package.
                    properties:
                      name:
                        description: 'Name is the package name: lowercase letters,
                          digits and ''-'' (DNS-1123 label).'
                        type: string
                      version:
                        description: Version is a semantic version (https://semver.org),
                          e.g. "1.2.0".
                        type: string
                    required:
                    - name
                    - version
                    type: object
                  spec:
                    description: Spec describes the challenge.
                    properties:
                      access:
                        description: Access defines how the student reaches the machines.
                        properties:
                          ide:
                            description: IDE runs a browser IDE (openvscode-server)
                              on a machine.
                            properties:
                              machine:
                                description: Machine the IDE runs on. Cannot be a
                                  vcluster machine.
                                type: string
                            required:
                            - machine
                            type: object
                          terminals:
                            description: Terminals offered to the student, in display
                              order.
                            items:
                              description: Terminal is a shell offered to the student.
                              properties:
                                label:
                                  description: Label shown on the terminal tab. Defaults
                                    to the machine name.
                                  type: string
                                machine:
                                  description: Machine the terminal opens on. Cannot
                                    be a vcluster machine.
                                  type: string
                                user:
                                  description: User the shell runs as. Defaults to
                                    "student".
                                  type: string
                              required:
                              - machine
                              type: object
                            maxItems: 16
                            minItems: 1
                            type: array
                          web:
                            description: Web endpoints inside the instance proxied
                              to the student's browser.
                            items:
                              description: WebEndpoint is an HTTP service inside the
                                instance shown to the student.
                              properties:
